
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>

<!-- CSS -->
<link rel="stylesheet" href="style.css">

<!-- BOOTSTRAP -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


</head>
<body>
    
<div class="container bg-success p-5 mt-5 rounded">

    <form action="" method="post">

        <h2>Custom Sneaker Order Form</h2>

        <label for="form-name" class="form-label">Name:</label> 
        <input type="text" name="username" id="form-name" class="textinput form-control">
    
        <label for="form-email">Email:</label> 
        <input type="email" name="emailaddress" id="form-email"class="textinput form-control">


        <label for="form-tel">Telephone:</label> 
        <input type="tel" name="telephone" id="form-tel"class="textinput form-control">


        <label for="form-story">Tell us about yourself:</label> <br>
        <textarea name="story" class="textinput form-control" maxlength="600" id="form-story" placeholder="No more than 600 characters long"></textarea>

        <label for="sizes">Size:</label>
        <select name="size" id="sizes" class="form-select">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
        </select> 
        
        <em>Sizes reflect standard US men's sizes</em>


        <label for="colors">Sneaker Color:</label>
        <fieldset id="colors" |>
            <legend>Color</legend>
          
            <div class="form-check">
                <label class="form-check-label">
                    <input type="radio" class="form-check-label" name="color" value="red"> Red
                </label>
            </div>

            <div class="form-check">
                <label class="form-check-label" >
                    <input type="radio" class="form-check-label" name="color" value="blue"> Blue
                </label>     
            </div>
           
    

            <div class="form-check"> 
                <label class="form-check-label">
                    <input type="radio" class="form-check-label"  name="color" value="black"> Black
                </label> 
            </div>

            <div class="form-check">
                <label class="form-check-label">
                    <input type="radio" class="form-check-label"  name="color" value="silver"> Silver
                </label>
            </div>
        </fieldset>
    
        
        <label for="features">Add-on Features:</label>

        
        <fieldset id="features">
            <legend>Feature</legend>
          <div class="form-check">
            <label class="form-check-label">
                <input type="checkbox" class="form-check-label" name="feature" value="laces"> Sparkley laces
            </label> 
            </div>

            <div class="form-check">
            <label>
                <input type="checkbox" class="form-check-label" name="feature" value="logo" checked> Metallic logo
            </label> 
            </div>

            <div class="form-check">
            <label class="form-check-label">
                <input type="checkbox" class="form-check-label" name="feature" value="heels"> Light-up heels
            </label> 
            </div>

            <div class="form-check">
            <label class="form-check-label">
                <input type="checkbox" class="form-check-label" name="feature" value="mp3"> MP3-enabled
            </label> 
            </div>
              </fieldset>
            
<br>

        <button type="button" class="btn btn-primary" value="ENTER"> ENTER
    </form>

</div>


</body>
</html>
